# Календарь событий Индии для «СМИ Бот».
#
# Как добавить событие — скопируйте блок и поменяйте поля:
#   id          уникальный латинский идентификатор
#   name_ru     название по-русски (идёт в карточку)
#   name_local  оригинальное название (по-английски / на хинди латиницей)
#   category    holiday | state_holiday | festival | sport | commercial | culture
#   scope       IN (вся страна) или список штатов: [MH, GJ]
#   importance  1 — региональное, 2 — заметное, 3 — главное
#   about       что это (1–2 предложения)
#   tip         подсказка менеджерам (если пусто — общая по категории)
#   place       город/площадка (необязательно)
# Дата задаётся одним из правил:
#   fixed: "MM-DD"                      каждый год
#   date: "YYYY-MM-DD" (+ end: ...)     разово
#   easter: N                           N дней от Пасхи (католической)
#   nth_weekday: {month, weekday (0=пн..6=вс), n (-1 = последний)}
#   offset: N                           сдвиг после вычисления
#   duration: N                         длительность в днях
#
# ВАЖНО: большинство индийских праздников идут по лунному календарю (Дивали, Холи, Ид…),
# их даты каждый год разные. Здесь они записаны конкретными датами до конца 2027 года —
# по официальному списку праздников правительства Индии на 2026 и 2027 годы
# (DoPT, Delhi/New Delhi: gazetted и restricted holidays). Исламские праздники могут сдвинуться
# на день по наблюдению луны. Список на 2028 год правительство публикует летом 2027 —
# тогда достаточно добавить новые даты (те же блоки с другим date).
# Праздники штатов — справочно, перед важными акциями лучше сверить.

# ─────────────────────────── Государственные праздники (фиксированные) ───────────────────────────

- id: republic_day
